# =============================================================================
# COMPANY CONFIG
# =============================================================================
# Each entry tells the scraper HOW to fetch jobs for that company.
#
# ats types supported out of the box:
#   greenhouse  -> needs: board_token
#   lever       -> needs: company_slug
#   workday     -> needs: tenant, site  (see notes below)
#   custom      -> handled by a dedicated function in src/custom_sites.py
#
# HOW TO FIND board_token / company_slug / tenant+site (2 minutes per company):
#   Greenhouse: open the company's careers page, look at network tab (F12) for
#               a request to boards-api.greenhouse.io/v1/boards/<TOKEN>/jobs
#               or the URL is often boards.greenhouse.io/<TOKEN>
#   Lever:      URL is usually jobs.lever.co/<SLUG>
#   Workday:    URL looks like https://<tenant>.wd5.myworkdayjobs.com/<site>
#               tenant = the subdomain before .wdN.myworkdayjobs.com
#               site   = the path segment right after the domain
#
# I have pre-filled the ones I'm confident about. Entries marked
# "VERIFY" are my best guess from training data and MUST be checked once —
# just run `python src/main.py --check-config` after deployment and it will
# tell you which ones 404 so you can fix the token in 2 minutes.
# =============================================================================

